[package]
name = "repodeck"
version = "0.1.0"
description = "Local-first Git repo and identity manager"
authors = ["Anshuman Gupta"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "repodeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.0", features = ["bundled-sqlcipher-vendored-openssl"] }
globset = "0.4.21"
notify = "8.2.1"
rand = "0.8"
hex = "0.4.3"
argon2 = "0.5"
thiserror = "2.0.21"
dunce = "1.0.5"
parking_lot = "0.13.0"
tauri-plugin-dialog = "2.8.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
jwalk = "0.9.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
