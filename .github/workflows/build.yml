# Builds RepoDeck installers for macOS, Windows and Linux on native runners.
# Runs on version tags (v*) and on demand. Installers are attached to the run as artifacts.
# On a tag, the `release` job first creates ONE draft release (notes from CHANGELOG.md), and every
# build job uploads its installers into that same draft. Don't create the release by hand.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          awk -v h="# RepoDeck $VER" '$0 == h {f=1; next} /^# RepoDeck / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $VER" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; builds will upload into it."
          else
            gh release create "$TAG" --draft --verify-tag --title "RepoDeck $VER" --notes-file notes.md
          fi

  build:
    needs: release
    # Still runs on manual runs, where `release` is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
          - name: windows-x64
            os: windows-latest
            args: --bundles msi,nsis
            bundle: src-tauri/target/release/bundle
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            bundle: src-tauri/target/release/bundle
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: --bundles deb,rpm,appimage
            bundle: src-tauri/target/release/bundle
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev xdg-utils file

      # SQLCipher's vendored OpenSSL is built with nmake and NASM on Windows.
      - name: Windows build tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - run: npm ci
      - run: npm run check
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        run: npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v5
        with:
          name: repodeck-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage

      - name: Upload to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          B: ${{ matrix.bundle }}
        run: |
          shopt -s nullglob
          files=("$B"/dmg/*.dmg "$B"/msi/*.msi "$B"/nsis/*.exe "$B"/deb/*.deb "$B"/rpm/*.rpm "$B"/appimage/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then echo "No installers found in $B"; exit 1; fi
          printf 'Uploading %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
