# Builds RepoDeck installers for macOS, Windows and Linux on native runners.
# Runs on version tags (v*) and on demand. Installers are attached to the run as artifacts;
# on a tag they are also attached to a draft GitHub release.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
          - name: windows-x64
            os: windows-latest
            args: --bundles msi,nsis
            bundle: src-tauri/target/release/bundle
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            bundle: src-tauri/target/release/bundle
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: --bundles deb,rpm,appimage
            bundle: src-tauri/target/release/bundle
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev xdg-utils file

      # SQLCipher's vendored OpenSSL is built with nmake and NASM on Windows.
      - name: Windows build tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - run: npm ci
      - run: npm run check
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        run: npm run tauri build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: repodeck-${{ matrix.name }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/msi/*.msi
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
